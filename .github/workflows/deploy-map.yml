name: Build & Deploy Map to GitHub Pages

# Builds the interactive triangulation map straight from this repo and
# publishes it to GitHub Pages. Runs entirely on GitHub's own servers.
# No external service is involved in the build or the hosting.

on:
  push:
    branches: [master]
    paths:
      - "artifacts/triangulation-map/**"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/triangulation-map
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build the client (static, no server, no backend)
        run: npx vite build

      - name: Add SPA + Jekyll-off files
        run: |
          touch dist/public/.nojekyll
          cp dist/public/index.html dist/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/triangulation-map/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
