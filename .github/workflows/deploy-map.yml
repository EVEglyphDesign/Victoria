name: Build & Deploy to GitHub Pages

# Builds the interactive triangulation map AND the gamification engine page
# straight from this repo and publishes both to GitHub Pages. Runs entirely on
# GitHub's own servers. No external service is involved in build or hosting.
#
#   /               → the triangulation map (unchanged)
#   /gamification/  → the gamification engine live page (reflected from
#                     eve-glyph-education/game/gamification-engine, the canon
#                     source of truth)
#   /assessment/    → the seven-dimension reference-assessment wireframe
#                     (static reflection from eve-glyph-education/
#                     assessment-service/wireframes, the canon source of truth)

on:
  push:
    branches: [master]
    paths:
      - "artifacts/triangulation-map/**"
      - "artifacts/gamification/**"
      - "artifacts/assessment/**"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Map (served at root) ──
      - name: Install map dependencies
        working-directory: artifacts/triangulation-map
        run: npm ci || npm install

      - name: Build the map (static, no server, no backend)
        working-directory: artifacts/triangulation-map
        run: npx vite build

      # ── Gamification page (served at /gamification/) ──
      - name: Install gamification dependencies
        working-directory: artifacts/gamification
        run: npm ci || npm install

      - name: Build the gamification page (static, no server, no backend)
        working-directory: artifacts/gamification
        run: npx vite build

      # ── Assemble the combined Pages site ──
      - name: Assemble site tree
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r artifacts/triangulation-map/dist/public/. _site/
          mkdir -p _site/gamification
          cp -r artifacts/gamification/dist/. _site/gamification/
          mkdir -p _site/assessment
          cp artifacts/assessment/index.html _site/assessment/index.html
          touch _site/.nojekyll
          cp _site/index.html _site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
